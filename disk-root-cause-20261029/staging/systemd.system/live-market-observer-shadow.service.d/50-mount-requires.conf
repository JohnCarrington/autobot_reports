# /etc/systemd/system/live-market-observer.service.d/50-mount-requires.conf
#
# Drop-in — 2026-10-29 Phase 3 remediation.
#
# Purpose: prevent the service from starting if the attached volume
# that holds its journal (/mnt/volume_lon1_1778405456698/research/live_obs/)
# is not mounted. Without this, systemd would start the service while
# the ReadWritePaths= constraint fails, OR (if the sandbox rules were
# relaxed) the service would silently create the journal directory on
# the ROOT filesystem — the exact failure mode this task is preventing.
#
# RequiresMountsFor= expands into Requires= + After= on the mount unit
# that owns the given path. systemd will refuse to start the service
# if the mount is inactive, and will stop the service if the mount
# fails during runtime.
#
# This drop-in is applied via `systemctl daemon-reload` and takes
# effect on the NEXT start of this service. The currently-running
# service process is not interrupted.
#
# Companion units covered by their own drop-ins:
#   live-market-observer-scenario-shadow.service
#   live-market-observer-shadow-exec.service
#   live-market-observer-shadow.service
#   live-market-observer-dashboard.service
#   live-market-observer-news-refresh.service
#   live-scenario-notifier.service

[Unit]
RequiresMountsFor=/mnt/volume_lon1_1778405456698
