# /etc/systemd/journald.conf.d/50-autobot-rotation.conf
#
# Journald rotation and retention policy for the AutoBot droplet
# (2026-10-29 Phase 3 remediation).
#
# Drop-in file. Takes precedence over /etc/systemd/journald.conf
# per systemd's standard directory-override semantics. The main
# config file is left unchanged.
#
# Current state (pre-change):
#   journalctl --disk-usage reports ~940 MB in /var/log/journal/
#   /etc/systemd/journald.conf: SystemMaxUse=1G
#   No MaxRetentionSec; no SystemKeepFree; retention governed only
#   by SystemMaxUse.
#
# New policy:
#   * SystemMaxUse=500M  — hard ceiling on on-disk journal footprint
#   * SystemKeepFree=5G  — journald will refuse to grow the journal
#                          if that growth would leave the root fs
#                          below 5 GB free. Safety net against a
#                          runaway syslog volume consuming the disk.
#   * MaxRetentionSec=14day — events older than 14 days are dropped
#                             even if the size budget allows.
#   * SystemMaxFileSize=50M — bound individual journal file size.
#                             Default is 1/8 of SystemMaxUse ≈ 62M,
#                             close to this value — making explicit.
#
# Retention impact: the current journal store spans approximately
# the last 14 days (first event ~2026-10-15). The new MaxRetentionSec
# formalises that boundary.
#
# Apply:
#   sudo install -m 0644 50-autobot-rotation.conf \
#     /etc/systemd/journald.conf.d/50-autobot-rotation.conf
#   sudo systemctl restart systemd-journald
#
# Verify:
#   journalctl --disk-usage         # should fall below 500M after vacuum
#   journalctl --header | grep -E 'Max Use|Max File Size|Keep Free'
#
# Vacuum (one-shot, to the new ceiling immediately):
#   sudo journalctl --vacuum-size=500M
#   sudo journalctl --vacuum-time=14d
#
# Rollback: `sudo rm /etc/systemd/journald.conf.d/50-autobot-rotation.conf
# && sudo systemctl restart systemd-journald` — restores the previous
# single-config state.
[Journal]
SystemMaxUse=500M
SystemKeepFree=5G
MaxRetentionSec=14day
SystemMaxFileSize=50M
