[Service]
ExecStartPre=/bin/mkdir -p /opt/tradingbot/env-history
ExecStartPre=/bin/sh -c 'cp /opt/tradingbot/.env "/opt/tradingbot/env-history/env.$(date -u +%%Y%%m%%dT%%H%%M%%SZ)" 2>/dev/null || true'
ExecStartPre=/bin/sh -c 'ls -1t /opt/tradingbot/env-history/env.* 2>/dev/null | tail -n +61 | xargs -r rm -- || true'
ExecStartPre=/opt/tradingbot/venv/bin/python /opt/tradingbot/scripts/env_drift_check.py
