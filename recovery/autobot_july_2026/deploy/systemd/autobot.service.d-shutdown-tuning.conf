# Drop-in override for autobot.service. Install as:
#   sudo mkdir -p /etc/systemd/system/autobot.service.d
#   sudo cp /opt/tradingbot/deploy/systemd/autobot.service.d-shutdown-tuning.conf \
#           /etc/systemd/system/autobot.service.d/shutdown-tuning.conf
#   sudo systemctl daemon-reload
#
# Ensures systemd gives the graceful-shutdown handler enough time to run
# (the in-process watchdog already bounds cleanup at 30s). Also pins the
# signal so we don't get surprised by an OS default change.

[Service]
TimeoutStopSec=45s
KillSignal=SIGTERM
SendSIGKILL=yes
