# Drop-in override for autobot.service — auth-suspension guard.
#
# Install as:
#   sudo cp /opt/tradingbot/deploy/systemd/autobot.service.d-auth-suspension-guard.conf \
#           /etc/systemd/system/autobot.service.d/auth-suspension-guard.conf
#   sudo systemctl daemon-reload
#
# What this fixes (incident 2026-07-10 09:26–14:30 UTC):
#   After a graceful stop, the fresh process login returned HTTP 401
#   error.security.client-suspended (an IG anti-fraud lockout triggered
#   by high-velocity logins). RestartSec=5 then queued ~2,500 further
#   login attempts over 5 hours, entrenching the suspension.
#
# RestartPreventExitStatus=78 pairs with ig_auth.FATAL_AUTH_EXIT_CODE
# (see ig_auth.py::FATAL_AUTH_EXIT_CODE and its unit-file consistency
# test in tests/unit/test_ig_auth.py). When ig_auth classifies a 401 as
# `error.security.client-suspended` — or its retry budget is exhausted —
# the process exits 78 and systemd MUST NOT relaunch it. Operator
# intervention is required (Telegram alert is sent by ig_auth).
#
# RestartSec=30 raises the outer floor for all OTHER restart classes.
# The in-process backoff owns fine-grained pacing for auth flaps; this
# floor only affects non-auth crashes (import errors, panics, etc.) so
# systemd can't out-run any external protection layer.

[Service]
RestartPreventExitStatus=78
RestartSec=30s
