# EMA Pullback MARKET-on-trigger activation addendum
#
# Appended to /opt/ema_pullback/.env on controlled-demo deployment of
# commit cff4718 (feat/final-safety-corrections-20261029).
#
# Review each line before appending. If you prefer, apply the deploy
# script with --write-env and it will append this block for you after
# verifying the current .env hash.

# ─── Strategy mode flip ────────────────────────────────────────────
# Switches the entry primitive from GTC STOP working order to
# immediate MARKET order on live-tick crossing of the frozen 5-bar
# ±3-pip trigger. All other strategy rules (admission, cancellation,
# SL/TP distances, NMS gate) are UNCHANGED.
MECHANICAL_ENTRY_MODE=market_on_trigger

# ─── MARKET-entry pre-flight budgets ───────────────────────────────
# Trigger tick must be within 2 pips of frozen entry level.
MAX_ENTRY_SLIPPAGE_PIPS=2.0
# Trigger tick must be at most 3 seconds old by wall clock.
QUOTE_MAX_AGE_SECONDS=3.0

# ─── UNCERTAIN lifecycle (D2 2026-10-29) ───────────────────────────
# If an open_market_entry submission's broker outcome cannot be
# authoritatively resolved via /positions or /history/activity
# within this window, the setup transitions to ESCALATED. The slot
# stays OCCUPIED; operator intervention is required via the
# ema_pullback.escalation_resolve CLI. A timeout does NOT auto-reject.
UNCERTAIN_ESCALATION_SECONDS=300
# Legacy knob retained for the OLD ORDER_WAITING branch's probe window.
UNCERTAIN_RESOLUTION_TIMEOUT_SECONDS=300

# ─── Execution-owner lock (v2 2026-10-29) ───────────────────────────
# Kernel-exclusive flock at /opt/ema_pullback/state/execution_owner.EMAPB.lock
# ensures only ONE process can submit live broker orders. Second
# instance at /home/autobot/ema_pullback cannot overwrite this.
EXECUTION_OWNER_ENFORCED=true
EXECUTION_OWNER_SERVICE_NAME=ema-pullback.service

# ─── Simulation-vs-production separation (D1 2026-10-29) ────────────
# LiveIGClient refuses to construct unless:
#  (a) running from /opt/ema_pullback (installation-root allowlist), AND
#  (b) parent process comm is `systemd` (not a bash supervisor), AND
#  (c) /opt/ema_pullback/.simulation-only marker is ABSENT.
PRODUCTION_INSTALLATION_ROOT=/opt/ema_pullback
REQUIRE_SYSTEMD_CONTEXT=true

# ─── Legacy GTC working-order inventory (D3 2026-10-29) ─────────────
# On service start, enumerate EMAPB-prefixed working orders and emit
# a read-only inventory report under /opt/ema_pullback/reports/.
LEGACY_WORKING_ORDER_INVENTORY_ENABLED=true
# AUTO-CANCEL IS OFF by operator instruction. Any cancellation goes
# through the ema_pullback.inventory_tool CLI with --confirm.
MARKET_ON_TRIGGER_STARTUP_CANCEL_EXISTING_WORKING_ORDERS=false
